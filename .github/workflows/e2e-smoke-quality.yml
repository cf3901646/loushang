name: E2E Smoke Quality

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  resume-turn:
    name: Resume turn (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: uv run python -c "from pathlib import Path; Path('.artifacts').mkdir(exist_ok=True)"
      - name: Real tool, persisted resume and selected terminal cancellation smoke
        env:
          CI_PLAN: ${{ inputs.plan }}
          PYTEST_ADDOPTS: >-
            --junitxml=.artifacts/resume-turn-${{ matrix.os }}.xml -o junit_family=xunit1
        run: uv run python scripts/ci/run_checks.py e2e_smoke
      - name: Verify every selected smoke case ran and passed
        shell: bash
        env:
          SMOKE_CASE_COUNT: ${{ fromJSON(inputs.plan).e2e_interaction && 2 || 1 }}
        run: >-
          uv run python scripts/dev/verify_pytest_xml.py
          .artifacts/resume-turn-${{ matrix.os }}.xml
          --require-tests-count "$SMOKE_CASE_COUNT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-turn-${{ matrix.os }}-pytest-report
          path: .artifacts/resume-turn-${{ matrix.os }}.xml
          if-no-files-found: warn
