name: E2E Smoke Quality

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  resume-turn:
    name: Resume turn (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: uv run python -c "from pathlib import Path; Path('.artifacts').mkdir(exist_ok=True)"
      - name: Resume session and send another message
        env:
          PYTEST_ADDOPTS: >-
            --junitxml=.artifacts/resume-turn-${{ matrix.os }}.xml
        run: uv run python scripts/ci/run_checks.py e2e_smoke
      - name: Verify the end-to-end case ran and passed
        run: >-
          uv run python scripts/dev/verify_pytest_xml.py
          .artifacts/resume-turn-${{ matrix.os }}.xml
          --require-tests-count 1
      - name: Verify macOS legacy same-ID Resume after resource change
        if: runner.os == 'macOS'
        env:
          PYTEST_ADDOPTS: >-
            --junitxml=.artifacts/resume-darwin-legacy.xml
        run: >-
          uv run python scripts/dev/run_pytest.py
          tests/coding/test_resume_darwin_legacy.py -q
      - name: Verify macOS Resume evidence
        if: runner.os == 'macOS'
        run: >-
          uv run python scripts/dev/verify_pytest_xml.py
          .artifacts/resume-darwin-legacy.xml
          --require-tests-count 2
          --require-property native_platform=darwin
          --require-property resume_route=legacy-same-id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-turn-${{ matrix.os }}-pytest-report
          path: |
            .artifacts/resume-turn-${{ matrix.os }}.xml
            .artifacts/resume-darwin-legacy.xml
          if-no-files-found: warn
