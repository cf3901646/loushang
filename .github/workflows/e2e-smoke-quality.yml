name: E2E Smoke Quality

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  resume-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - name: Resume session and send another message
        run: uv run python scripts/ci/run_checks.py e2e_smoke

  selected-checks:
    name: Selected checks
    if: always()
    needs: [resume-turn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected job
        env:
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci/verify_gate.py --section workflows
          --jobs '{"resume-turn":"e2e"}'
