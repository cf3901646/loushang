name: Module Regression Quality

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Module regression (${{ matrix.package }} ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.plan).unit_jobs }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: mkdir -p .artifacts
      - name: Complete offline module regression
        env:
          PYTEST_ADDOPTS: >-
            --junitxml=.artifacts/module-${{ matrix.package }}-${{ matrix.shard }}.xml
            --durations=20
        run: >-
          uv run python scripts/ci/run_checks.py unit_${{ matrix.package }}
          --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}
      - name: Verify nonempty passing module report
        run: >-
          uv run python scripts/dev/verify_pytest_xml.py
          .artifacts/module-${{ matrix.package }}-${{ matrix.shard }}.xml
          --allow-skipped
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-${{ matrix.package }}-${{ matrix.shard }}-pytest-report
          path: .artifacts/module-${{ matrix.package }}-${{ matrix.shard }}.xml
          if-no-files-found: warn

  selected-checks:
    name: Selected checks
    if: always()
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected job
        env:
          CI_PLAN: ${{ inputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci/verify_gate.py --section workflows
          --jobs '{"package":"units"}'
